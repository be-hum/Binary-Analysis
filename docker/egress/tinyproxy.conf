User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info
MaxClients 50
# agentnet 등 사설 대역에서만 접속 허용
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
# 허용 목록(filter)에 있는 호스트만 통과, 나머지는 거부
FilterDefaultDeny Yes
FilterType ere
Filter "/etc/tinyproxy/filter"
# HTTPS CONNECT 는 443 만
ConnectPort 443
DisableViaHeader Yes
